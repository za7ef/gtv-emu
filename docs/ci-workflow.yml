# يُنقل هذا الملف إلى .github/workflows/ci.yml لتفعيل الاختبار الآلي.
name: الاختبارات
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: البناء
        run: CC=gcc ./build.sh
      - name: اختبارات الوحدة
        run: gcc -O1 -w -o unit tests/unit_test.c core/simd.c core/devices.c core/virtio.c core/netstack.c core/bootimg.c core/fdt.c core/jit.c -lm -lpthread && ./unit
      - name: اختبار الإقلاع
        run: ./tests/boot_test.sh
      - name: اختبار الواجهة المضمِّنة (التي يستخدمها تطبيق iOS)
        run: CC=gcc ./tests/api_test.sh
      - name: حفظ سجل الإقلاع
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: |
            /tmp/gtv-emu-test/boot.log
            /tmp/gtv-emu-test/screen.png
  # اختبار المترجم الفوري على معالج ARM64 حقيقي، مع مقارنة السرعة بالمفسّر
  jit-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: البناء
        run: CC=gcc ./build.sh
      - name: اختبار الإقلاع بالمترجم الفوري
        run: ./tests/boot_test.sh && grep -E "توقف|JIT" /tmp/gtv-emu-test/emu.log
      - name: اختبار الإقلاع بالمفسّر وحده للمقارنة
        run: EMU_ARGS=--no-jit ./tests/boot_test.sh && grep "توقف" /tmp/gtv-emu-test/emu.log
