# مشروع تطبيق iOS، يُولَّد ملف Xcode منه بأداة XcodeGen:  cd ios && xcodegen generate
name: GTVEmu
options:
  bundleIdPrefix: com.za7ef
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    ARCHS: arm64
    ENABLE_BITCODE: NO
targets:
  GTVEmu:
    type: application
    platform: iOS
    sources:
      - path: GTVEmu
      - path: Shared
      - path: ../core
        excludes:
          - main.c
    dependencies:
      - sdk: libz.tbd
      # مساعد JIT المدمج يُضمَّن في PlugIns
      - target: GTVJITHelper
      # إطار StikJIT ‏(MPL-2.0، ويتضمن مكتبة idevice بترخيص MIT) يُضمَّن في Frameworks دون ربطه بالتطبيق؛
      # يستخدمه المساعد وحده
      - framework: Vendor/StikJIT.xcframework
        embed: true
        link: false
    info:
      path: GTVEmu/Info.plist
      properties:
        CFBundleDisplayName: GTV Emu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [audio]
        LSApplicationQueriesSchemes: [stikdebug]
        NSBonjourServices: [_remotepairing._tcp]
        NSLocalNetworkUsageDescription: يبحث التطبيق عن منفذ خدمة الاقتران في هذا الجهاز لتفعيل المترجم الفوري.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
    entitlements:
      path: GTVEmu/GTVEmu.entitlements
      properties:
        get-task-allow: true
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.za7ef.gtvemu
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: GTVEmu/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_OPTIMIZATION_LEVEL: "3"
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        OTHER_CFLAGS: -fno-strict-aliasing
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # مساعد JIT المدمج: عملية مستقلة تُرفق المصحّح بالتطبيق عبر LocalDevVPN، لأن العملية لا تصحّح نفسها
  GTVJITHelper:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: GTVJITHelper
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - framework: Vendor/StikJIT.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.za7ef.gtvemu.JITHelper
        INFOPLIST_FILE: GTVJITHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
